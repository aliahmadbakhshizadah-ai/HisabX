<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>اپلیکیشن حساب ایکس پرو</title>
    
    <!-- حقه فنی برای دور زدن کش سخت‌گیر مرورگر و گیت‌هاب -->
    <script>
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = 'manifest.json?v=' + Math.random();
        document.head.appendChild(link);
    </script>

    <meta name="theme-color" content="#4f46e5">
    <style>
        /* ظاهر جدید و کاملاً متفاوت برای تست لود شدن فایل */
        :root {
            --bg-body: #0f172a;
            --bg-calc: #1e1b4b; /* رنگ بنفش تیره که کاملاً متمایز است */
            --bg-screen: #312e81;
            --text-color: #ffffff;
            --btn-bg: #4338ca;
            --btn-hover: #4f46e5;
        }
        .light-theme {
            --bg-body: #f1f5f9;
            --bg-calc: #ffffff;
            --bg-screen: #e2e8f0;
            --text-color: #0f172a;
            --btn-bg: #cbd5e1;
            --btn-hover: #94a3b8;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 0; user-select: none; }
        body { background: var(--bg-body); display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .calculator { background: var(--bg-calc); padding: 25px; border-radius: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); width: 100%; max-width: 350px; border: 2px solid #4f46e5; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; color: var(--text-color); font-weight: bold; font-size: 1.1rem; }
        .theme-btn { background: #6366f1; color: white; border: none; padding: 8px 14px; border-radius: 15px; cursor: pointer; font-size: 0.85rem; font-weight: bold; }
        .display { width: 100%; height: 80px; background: var(--bg-screen); border: none; outline: none; border-radius: 18px; color: var(--text-color); font-size: 2.4rem; text-align: left; padding: 15px; margin-bottom: 20px; direction: ltr; font-weight: bold; box-shadow: inset 0 2px 5px rgba(0,0,0,0.3); }
        .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
        button { padding: 18px; font-size: 1.4rem; font-weight: bold; border: none; outline: none; border-radius: 16px; background: var(--btn-bg); color: var(--text-color); cursor: pointer; transition: all 0.15s ease; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        button:hover { background: var(--btn-hover); transform: translateY(-2px); }
        button:active { transform: scale(0.95); }
        button.operator { background: #f59e0b; color: #fff; }
        button.operator:hover { background: #d97706; }
        button.clear { background: #ef4444; color: #fff; }
        button.clear:hover { background: #dc2626; }
        button.equal { background: #10b981; color: #fff; grid-column: span 2; box-shadow: 0 4px 10px rgba(16,185,129,0.4); }
        button.equal:hover { background: #059669; }
    </style>
</head>
<body>

<div class="calculator">
    <div class="top-bar">
        <span>حساب ایکس پرو 💎</span>
        <button class="theme-btn" onclick="toggleTheme()">🌓 ظاهر روشن</button>
    </div>
    <input type="text" id="calcScreen" class="display" readonly placeholder="0">
    <div class="buttons">
        <button class="clear" onclick="clearScreen()">C</button>
        <button class="clear" onclick="backspace()">⌫</button>
        <button onclick="press('(')">(</button>
        <button onclick="press(')')">)</button>

        <button onclick="press('7')">7</button>
        <button onclick="press('8')">8</button>
        <button onclick="press('9')">9</button>
        <button class="operator" onclick="press('/')">÷</button>

        <button onclick="press('4')">4</button>
        <button onclick="press('5')">5</button>
        <button onclick="press('6')">6</button>
        <button class="operator" onclick="press('*')">×</button>

        <button onclick="press('1')">1</button>
        <button onclick="press('2')">2</button>
        <button onclick="press('3')">3</button>
        <button class="operator" onclick="press('-')">-</button>

        <button onclick="press('0')">0</button>
        <button onclick="press('.')">.</button>
        <button class="equal" onclick="calculate()">=</button>
        <button class="operator" onclick="press('+')">+</button>
    </div>
</div>

<script>
    const displayElement = document.getElementById('calcScreen');

    function press(num) { displayElement.value += num; }
    function clearScreen() { displayElement.value = ''; }
    function backspace() { displayElement.value = displayElement.value.slice(0, -1); }
    
    function calculate() {
        try {
            if (displayElement.value.trim() === "") return;
            let result = eval(displayElement.value);
            displayElement.value = Number(result.toFixed(6));
        } catch (error) {
            displayElement.value = 'Error';
        }
    }

    function toggleTheme() { document.body.classList.toggle('light-theme'); }

    document.addEventListener('keydown', (event) => {
        const key = event.key;
        if ((key >= '0' && key <= '9') || key === '.' || key === '+' || key === '-' || key === '*' || key === '/' || key === '(' || key === ')') {
            press(key);
        } else if (key === 'Enter' || key === '=') {
            event.preventDefault();
            calculate();
        } else if (key === 'Backspace') {
            backspace();
        } else if (key === 'Escape') {
            clearScreen();
        }
    });

    // ثبت سرویس‌ورکر به همراه حقه فنی برای نسخه جدید
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js?v=' + Math.random()).then(reg => {
                console.log('موتور آفلاین فعال شد.');
            });
        });
    }
</script>
</body>
</html>
