<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اپلیکیشن ماشین حساب حرفه‌ای</title>
    <!-- اتصال به فایل مانیفست برای اندروید و ویندوز -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1f1f26">
    <style>
        :root {
            --bg-body: #141419;
            --bg-calc: #1f1f26;
            --bg-screen: #141419;
            --text-color: #ffffff;
            --btn-bg: #2d2d38;
            --btn-hover: #3e3e4d;
        }
        .light-theme {
            --bg-body: #f0f2f5;
            --bg-calc: #ffffff;
            --bg-screen: #f0f2f5;
            --text-color: #1f2937;
            --btn-bg: #e5e7eb;
            --btn-hover: #d1d5db;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 0; transition: all 0.2s ease; }
        body { background: var(--bg-body); display: flex; justify-content: center; align-items: center; height: 100vh; }
        .calculator { background: var(--bg-calc); padding: 25px; border-radius: 24px; box-shadow: 0 15px 35px rgba(0,0,0,0.3); width: 100%; max-width: 350px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; color: var(--text-color); font-weight: bold; }
        .theme-btn { background: var(--btn-bg); color: var(--text-color); border: none; padding: 6px 12px; border-radius: 12px; cursor: pointer; font-size: 0.85rem; }
        .display { width: 100%; height: 75px; background: var(--bg-screen); border: none; outline: none; border-radius: 14px; color: var(--text-color); font-size: 2.2rem; text-align: left; padding: 15px; margin-bottom: 20px; direction: ltr; }
        .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        button { padding: 18px; font-size: 1.3rem; font-weight: bold; border: none; outline: none; border-radius: 12px; background: var(--btn-bg); color: var(--text-color); cursor: pointer; }
        button:hover { background: var(--btn-hover); transform: translateY(-2px); }
        button.operator { background: #ff9f0a; color: #fff; }
        button.operator:hover { background: #f19300; }
        button.clear { background: #f43f5e; color: #fff; }
        button.clear:hover { background: #e11d48; }
        button.equal { background: #10b981; color: #fff; grid-column: span 2; }
        button.equal:hover { background: #059669; }
    </style>
</head>
<body>

<div class="calculator">
    <div class="top-bar">
        <span>ماشین حساب پرو</span>
        <button class="theme-btn" onclick="toggleTheme()">🌓 تغییر تم</button>
    </div>
    <input type="text" id="calcScreen" class="display" readonly placeholder="0">
    <div class="buttons">
        <button class="clear" onclick="clearScreen()">C</button>
        <button class="clear" onclick="backspace()">⌫</button>
        <button onclick="press('(')">(</button>
        <button onclick="press(')')">)</button>

        <button onclick="press('7')">7</button>
        <button onclick="press('8')">8</button>
        <button onclick="press('9')">9</button>
        <button class="operator" onclick="press('/')">÷</button>

        <button onclick="press('4')">4</button>
        <button onclick="press('5')">5</button>
        <button onclick="press('6')">6</button>
        <button class="operator" onclick="press('*')">×</button>

        <button onclick="press('1')">1</button>
        <button onclick="press('2')">2</button>
        <button onclick="press('3')">3</button>
        <button class="operator" onclick="press('-')">-</button>

        <button onclick="press('0')">0</button>
        <button onclick="press('.')">.</button>
        <button class="equal" onclick="calculate()">=</button>
        <button class="operator" onclick="press('+')">+</button>
    </div>
</div>

<script>
    const displayElement = document.getElementById('calcScreen');

    function press(num) { displayElement.value += num; }
    function clearScreen() { displayElement.value = ''; }
    function backspace() { displayElement.value = displayElement.value.slice(0, -1); }
    
    function calculate() {
        try {
            if (displayElement.value.trim() === "") return;
            let result = eval(displayElement.value);
            displayElement.value = Number(result.toFixed(6));
        } catch (error) {
            displayElement.value = 'Error';
        }
    }

    function toggleTheme() { document.body.classList.toggle('light-theme'); }

    // پشتیبانی از کیبورد کامپیوتر
    document.addEventListener('keydown', (event) => {
        const key = event.key;
        if ((key >= '0' && key <= '9') || key === '.' || key === '+' || key === '-' || key === '*' || key === '/' || key === '(' || key === ')') {
            press(key);
        } else if (key === 'Enter' || key === '=') {
            event.preventDefault();
            calculate();
        } else if (key === 'Backspace') {
            backspace();
        } else if (key === 'Escape') {
            clearScreen();
        }
    });

    // فعال‌سازی Service Worker برای نصب روی اندروید و ویندوز
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').then(() => {
            console.log('سرویس ورکر فعال شد');
        });
    }
</script>
</body>
</html>
